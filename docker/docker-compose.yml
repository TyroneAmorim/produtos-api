version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: produtos
      MYSQL_USER: produtos_usr
      MYSQL_PASSWORD: produtos_pass
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
