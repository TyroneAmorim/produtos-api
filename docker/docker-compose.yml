version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: produtos
      MYSQL_USER: produtos_usr
      MYSQL_PASSWORD: produtos_pass
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - app-network
  
  api:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: api-produtos
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: produtos_usr
      DB_PASS: produtos_pass
      DB: produtos
      DB_TYPE: mariadb
      JWT_SECRET: da39a3ee5e6b4b0d3255bfef95601890afd80709
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge